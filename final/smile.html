<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>מסך נעול</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body{justify-content:center;min-height:100vh;gap:18px}
#start[hidden]{display:none}
#lock{font-size:54px;line-height:1}
#cam{position:relative;width:240px;height:240px;display:none}
#cam video{position:absolute;inset:14px;width:212px;height:212px;border-radius:50%;object-fit:cover;transform:scaleX(-1);background:#14122b}
#cam svg{position:absolute;inset:0;width:240px;height:240px;transform:rotate(-90deg)}
#ring{transition:stroke-dashoffset .15s linear,stroke .3s}
#st{font-size:15px;opacity:.7;min-height:22px}
.code{margin-top:6px}
</style></head><body>
<button class="btn" id="start">התחלה</button>
<div class="small" id="priv">הדף משתמש במצלמה. שום תמונה לא נשמרת ולא נשלחת לשום מקום.</div>
<div id="lock">🔒</div>
<h1>מסך נעול</h1>
<div id="cam"><video id="v" playsinline muted autoplay></video>
<svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="112" fill="none" stroke="#2B2752" stroke-width="8"/><circle id="ring" cx="120" cy="120" r="112" fill="none" stroke="#8FD6C8" stroke-width="8" stroke-linecap="round" stroke-dasharray="703.7" stroke-dashoffset="703.7"/></svg></div>
<div id="st"></div>
<div class="code" id="code">נפתח! מילת הקוד:<b>גבינה</b></div>
<script>
const $=id=>document.getElementById(id),st=$('st'),ring=$('ring'),L=703.7;
const TH=0.7,HOLD=3000;let done=false,since=0,stream=null;   // must keep smiling for 3 seconds
function setRing(p){ring.style.strokeDashoffset=L*(1-Math.max(0,Math.min(1,p)))}
const load=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load '+src));document.head.appendChild(s)});
$('start').onclick=async()=>{
  $('start').hidden=true;st.textContent='טוען…';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:480},height:{ideal:480}},audio:false});
  }catch(e){st.textContent='אין גישה למצלמה. אשרו גישה בדפדפן ורעננו את הדף.';$('start').hidden=false;return}
  const v=$('v');v.srcObject=stream;$('cam').style.display='block';
  try{await v.play()}catch(e){}
  try{
    if(!window.faceapi)await load('lib/face-api.js');
    await faceapi.nets.tinyFaceDetector.loadFromUri('lib/models');
    await faceapi.nets.faceExpressionNet.loadFromUri('lib/models');
  }catch(e){st.textContent='הטעינה נכשלה. בדקו אינטרנט ורעננו את הדף.';return}
  st.textContent='';loop()};
async function loop(){
  if(done)return;
  const v=$('v');
  if(v.readyState>=2){
    try{
      const r=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:0.4})).withFaceExpressions();
      const h=r?r.expressions.happy:0,now=Date.now();
      st.textContent=r?'':'לא רואה פנים';
      if(h>=TH){if(!since)since=now}else since=0;
      setRing(since?(now-since)/HOLD:0);
      if(since&&now-since>=HOLD){unlock();return}
    }catch(e){st.textContent='שגיאה: '+(e.message||e)}
  }
  setTimeout(loop,120)}
function unlock(){done=true;setRing(1);ring.style.stroke='#3DDC84';$('lock').textContent='🔓';$('code').style.display='block';st.textContent='';
  try{navigator.vibrate&&navigator.vibrate([80,60,160])}catch(e){}
  try{stream.getTracks().forEach(t=>t.stop())}catch(e){}confetti()}
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99';document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,g=c.getContext('2d'),C=['#8FD6C8','#FFD166','#FF9F80','#B8A6FF','#3DDC84','#F2F5F4'];
  const P=[...Array(140)].map(()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,s:Math.random()*8+5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:C[Math.random()*C.length|0]}));
  const t0=performance.now();(function f(t){g.clearRect(0,0,W,H);const a=1-Math.max(0,(t-t0-1400)/600);
    for(const p of P){p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=Math.max(0,a);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()}
    if(t-t0<2000)requestAnimationFrame(f);else c.remove()})(t0)}
</script></body></html>
