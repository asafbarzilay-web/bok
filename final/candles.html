<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>הדליקו</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body{justify-content:center;min-height:100vh;gap:14px}
#start[hidden]{display:none}
svg{width:100%;max-width:380px}
.fl{opacity:0;transition:opacity .35s;transform-origin:center bottom}
.on .fl{opacity:1;animation:fk 1.1s infinite alternate}
@keyframes fk{from{transform:scale(1)}to{transform:scale(1.12,.94)}}
.ltr{font:900 30px Heebo,Arial;fill:#FFD166;opacity:0;transition:opacity .4s}
.on .ltr{opacity:1}
#st{font-size:15px;opacity:.75;min-height:22px}
#cdot{position:fixed;top:12px;left:12px;font-size:26px;opacity:0;pointer-events:none}
#cdot.show{animation:pl 1.4s infinite}
@keyframes pl{0%,100%{opacity:.1}50%{opacity:.9}}
.code{margin-top:4px}
</style></head><body>
<div class="small" id="priv">הדף משתמש במצלמה. שום תמונה לא נשמרת ולא נשלחת לשום מקום.</div>
<button class="btn" id="start">התחלה</button>
<h1>הדליקו</h1>
<svg id="menora" viewBox="0 0 380 230"></svg>
<div id="st"></div>
<div class="code" id="code">הנרות דולקים! מילת הקוד:<b>סופגנייה</b></div>
<div id="cdot">📷</div>
<video id="v" playsinline muted autoplay style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none"></video>
<canvas id="cv" width="16" height="16" hidden></canvas>
<script>
const WORD='סופגנייה',N=8,$=id=>document.getElementById(id);
// ---- menorah drawing: 8 candles (first letter = rightmost) + shamash in the middle ----
const NS='http://www.w3.org/2000/svg',sv=$('menora');
const add=(t,a,p=sv)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
add('path',{d:'M30 196 H350 M190 196 V170 M36 150 Q36 196 190 196 Q344 196 344 150',stroke:'#8FD6C8',fill:'none','stroke-width':6,'stroke-linecap':'round'});
add('rect',{x:150,y:208,width:80,height:10,rx:5,fill:'#8FD6C8'});
const X=[...Array(N)].map((_,i)=>i<4?334-i*38:46+(7-i)*38+0);   // computed below
const pos=[];for(let i=0;i<N;i++){const slot=i<4?i:i+1;pos.push(344-18-slot*(308/8)*1.0)}   // slot 4 (middle) is the shamash
const cx=[];for(let s=0;s<9;s++)cx.push(354-s*40);                    // right → left
const cand=[];
function candle(x,h,lit){const g=add('g',{});add('rect',{x:x-6,y:196-h,width:12,height:h,rx:2,fill:'#F2F5F4'});add('line',{x1:x,y1:196-h,x2:x,y2:196-h-7,stroke:'#14122b','stroke-width':2});
  const f=add('g',{class:'fl'},g);add('path',{d:`M${x} ${196-h-8} q-9 -12 0 -30 q9 18 0 30`,fill:'#FFB347'},f);add('path',{d:`M${x} ${196-h-9} q-4 -8 0 -17 q4 10 0 17`,fill:'#FFF3B0'},f);
  return g}
for(let i=0;i<N;i++){const slot=i<4?i:i+1;const x=cx[slot];const g=candle(x,46);const t=add('text',{x,y:92,'text-anchor':'middle',class:'ltr'},g);t.textContent=WORD[i];cand.push(g)}
{const g=candle(cx[4],62);g.classList.add('on')}   // shamash is always lit (decoration)
// ---- light sensing through the rear camera ----
const cv=$('cv'),cx2=cv.getContext('2d',{willReadFrequently:true}),v=$('v');
let hist=[],lit=0,done=false,stream=null,t0=Date.now(),fullSince=0;
const meanLum=()=>{cx2.drawImage(v,0,0,16,16);const d=cx2.getImageData(0,0,16,16).data;let s=0;for(let i=0;i<d.length;i+=4)s+=.3*d[i]+.59*d[i+1]+.11*d[i+2];return s/256};
function tick(){
  if(done)return;
  const now=Date.now();let l=(window.__lum!==undefined)?window.__lum:(v.readyState>=2?meanLum():null);
  if(l!==null){
    hist.push([now,l]);while(hist.length&&now-hist[0][0]>5000)hist.shift();
    const base=Math.max(40,...hist.map(h=>h[1]));          // brightest moment in the last 5 s
    const dark=Math.max(0,Math.min(1,1-l/base)),abs=l<12?1:0;
    const d=Math.max(dark,abs);
    const n=Math.round(Math.max(0,Math.min(1,(d-0.25)/0.6))*N);   // 0.25 → first candle, 0.85 → all eight
    setLit(n);
    if(n===N){if(!fullSince)fullSince=now;if(now-fullSince>600){finish();return}}else fullSince=0;
  }
  // hints: a pulsing camera dot after 25 s, a sentence after 60 s
  const s=(now-t0)/1000;if(s>25)$('cdot').classList.add('show');if(s>60&&lit===0)$('st').textContent='הנרות מרגישים את האור סביבם';
  setTimeout(tick,100)}
function setLit(n){if(n===lit)return;lit=n;cand.forEach((g,i)=>g.classList.toggle('on',i<n))}
function finish(){done=true;setLit(N);$('code').style.display='block';$('cdot').classList.remove('show');try{navigator.vibrate&&navigator.vibrate([80,60,160])}catch(e){}try{stream.getTracks().forEach(t=>t.stop())}catch(e){}confetti()}
$('start').onclick=async()=>{
  $('start').hidden=true;$('st').textContent='';
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:160},height:{ideal:160}},audio:false})}
  catch(e){$('st').textContent='אין גישה למצלמה. אשרו גישה בדפדפן ורעננו את הדף.';$('start').hidden=false;return}
  v.srcObject=stream;try{await v.play()}catch(e){}
  t0=Date.now();tick()};
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99';document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,g=c.getContext('2d'),C=['#8FD6C8','#FFD166','#FF9F80','#B8A6FF','#3DDC84','#F2F5F4'];
  const P=[...Array(140)].map(()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,s:Math.random()*8+5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:C[Math.random()*C.length|0]}));
  const t0=performance.now();(function f(t){g.clearRect(0,0,W,H);const a=1-Math.max(0,(t-t0-1400)/600);
    for(const p of P){p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=Math.max(0,a);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()}
    if(t-t0<2000)requestAnimationFrame(f);else c.remove()})(t0)}
</script></body></html>
