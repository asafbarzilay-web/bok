<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>מצפן</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
.wrap{position:relative;width:300px;height:300px}
svg{width:100%;height:100%;overflow:visible}
#rose{transition:transform .12s linear;transform-origin:150px 150px}
.target{font-size:30px;font-weight:900;color:#FFD166;min-height:40px}
.steps{display:flex;gap:4px;justify-content:center;direction:rtl;flex-wrap:wrap;align-items:center}
.steps span{padding:3px 7px;border-radius:9px;background:#2B2752;font-weight:700;font-size:14px}
.steps span.ok{background:#3DDC84;color:#1E1B3A}.steps span.now{background:#FFD166;color:#1E1B3A}
.ring{font-size:20px;font-weight:700;min-height:28px}
</style>
</head><body>
<h1>🧭 המצפן</h1>
<p>החזיקו את הטלפון <b>שטוח</b>, וסובבו את עצמכם עד שהחץ האדום למעלה מצביע לכיוון המבוקש. מחזיקים 2 שניות, ועוברים לכיוון הבא.</p>
<div class="steps" id="steps"></div>
<div class="target" id="tg"></div>
<button class="btn" id="go">התחילו</button>
<div class="wrap">
<svg viewBox="0 0 300 300">
  <circle cx="150" cy="150" r="146" fill="#2B2752" stroke="#8FD6C8" stroke-width="6"/>
  <circle id="prog" cx="150" cy="150" r="138" fill="none" stroke="#3DDC84" stroke-width="8" stroke-dasharray="0 1000" transform="rotate(-90 150 150)" stroke-linecap="round"/>
  <g id="rose"></g>
  <polygon points="150,6 140,30 160,30" fill="#FF6B6B"/>
  <line x1="150" y1="30" x2="150" y2="60" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="150" cy="150" r="7" fill="#F2F5F4"/>
</svg>
</div>
<div class="ring" id="t">—</div>
<div class="code" id="code">הצלחתם! מילת הקוד:<b>קקטוס</b></div>
<script>
const SEQ=[['צפון',0],['דרום',180],['מזרח',90],['מערב',270],['צפון',0]],HOLD=2,TOL=15;
const $=id=>document.getElementById(id);
// build rose
(function(){let s='';for(let d=0;d<360;d+=5){const long=d%30===0,r1=long?112:120,r2=128,a=d*Math.PI/180;
  s+='<line x1="'+(150+r1*Math.sin(a))+'" y1="'+(150-r1*Math.cos(a))+'" x2="'+(150+r2*Math.sin(a))+'" y2="'+(150-r2*Math.cos(a))+'" stroke="#8FD6C8" stroke-width="'+(long?3:1.5)+'" opacity="'+(long?1:.6)+'"/>'}
  [['צ',0,'#FF6B6B'],['מז',90,'#F2F5F4'],['ד',180,'#F2F5F4'],['מע',270,'#F2F5F4']].forEach(([l,d,c])=>{const a=d*Math.PI/180;
    s+='<text x="'+(150+90*Math.sin(a))+'" y="'+(150-90*Math.cos(a)+11)+'" text-anchor="middle" font-family="Heebo" font-weight="900" font-size="30" fill="'+c+'" transform="rotate('+d+' '+(150+90*Math.sin(a))+' '+(150-90*Math.cos(a))+')">'+l+'</text>'});
  s+='<polygon points="150,62 141,150 159,150" fill="#FF6B6B"/><polygon points="150,238 141,150 159,150" fill="#F2F5F4" opacity=".8"/>';
  s+='<g id="tmark"><circle cx="150" cy="24" r="0"/></g>';
  $('rose').innerHTML=s})();
let st=0,head=null,held=0,last=performance.now(),won=false,pause=0;
function steps(){$('steps').innerHTML=SEQ.map((x,i)=>'<span class="'+(i<st?'ok':i===st?'now':'')+'">'+x[0]+'</span>').join('<i style="font-style:normal;opacity:.5;font-size:12px">←</i>');
  $('tg').textContent=st<SEQ.length?'כוונו ל'+SEQ[st][0]:'🎉';
  const a=st<SEQ.length?SEQ[st][1]:0;$('tmark').innerHTML=st<SEQ.length?'<polygon points="150,22 140,4 160,4" fill="#FFD166" transform="rotate('+a+' 150 150)"/>':''}
steps();
function onAbs(e){if(e.absolute&&e.alpha!=null)head=(360-e.alpha)%360}
function onIos(e){if(e.webkitCompassHeading!=null)head=e.webkitCompassHeading}
$('go').onclick=async()=>{
  try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission()}catch(e){}
  addEventListener('deviceorientationabsolute',onAbs);addEventListener('deviceorientation',onIos);
  $('go').hidden=true;
  (function loop(now){const dt=(now-last)/1000;last=now;
    if(head==null){$('t').textContent='מחכה למצפן… (הזיזו את הטלפון בצורת 8)'}
    else{$('rose').style.transform='rotate('+(-head)+'deg)';
      if(!won&&pause<=0){const tgt=SEQ[st][1];let off=Math.abs(((head-tgt)%360+540)%360-180);
        held=off<TOL?held+dt:0;$('prog').setAttribute('stroke-dasharray',(Math.min(1,held/HOLD)*867)+' 1000');
        $('t').textContent=off<TOL?'✔ מחזיקים…':'עוד \u2066'+Math.round(off)+'°\u2069';
        if(held>=HOLD){st++;held=0;$('prog').setAttribute('stroke-dasharray','0 1000');try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
          if(st>=SEQ.length){won=true;steps();$('code').style.display='block';$('t').textContent='✔ כל הכבוד!'}
          else{steps();pause=.8;$('t').textContent='👏 יפה! עכשיו '+SEQ[st][0]}}}
      else pause-=dt}
    requestAnimationFrame(loop)})(performance.now());
};
</script>
</body></html>
