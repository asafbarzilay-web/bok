<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>קוד רטט</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
.dots{display:flex;gap:10px;justify-content:center;margin:6px 0}
.dots i{width:16px;height:16px;border-radius:50%;background:#2B2752;border:2px solid #8FD6C8}
.dots i.done{background:#8FD6C8}
.dots i.now{background:#FFD166;border-color:#FFD166}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#st{font-size:20px;font-weight:700}
</style>
</head><body>
<h1>📳 הודעה ברטט</h1>
<p>שימו יד על הטלפון ולחצו "נגנו". הטלפון ירטוט אות אחת בקוד מורס: רטט קצר = • , רטט ארוך = ▬. הטבלה נמצאת בשקף.</p>
<p class="small" id="ios" hidden>הטלפון הזה לא יכול לרטוט מהדפדפן, אז תשמעו צפצופים במקום (קצר / ארוך). הגבירו את הקול.</p>
<div class="dots" id="dots"></div>
<div class="card" id="st">אות 1 מתוך 5</div>
<div class="row">
  <button class="btn" id="play">▶ נגנו</button>
</div>
<div class="row">
  <button class="btn ghost" id="prev">→ אות קודמת</button>
  <button class="btn ghost" id="next">אות הבאה ←</button>
</div>
<p class="small">כתבו כל אות שזיהיתם. 5 אותיות = מילה אחת.</p>
<script>
// word: מ צ ל מ ה  (Hebrew Morse)  1 = short, 3 = long
const WORD=[[3,3],[1,3,3],[1,3,1,1],[3,3],[3,3,3]],U=230;
const canBuzz=!!navigator.vibrate&&!/iPhone|iPad|iPod/.test(navigator.userAgent);
if(!canBuzz)document.getElementById('ios').hidden=false;
let cur=0,busy=false,ac=null;
const st=document.getElementById('st'),dots=document.getElementById('dots');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function render(){dots.innerHTML=WORD.map((_,i)=>'<i class="'+(i<cur?'done':i===cur?'now':'')+'"></i>').join('');
  if(!busy)st.textContent='אות '+(cur+1)+' מתוך '+WORD.length;
  document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===WORD.length-1;
  document.getElementById('play').textContent=played[cur]?'🔁 שוב את אות '+(cur+1):'▶ נגנו את אות '+(cur+1)}
const played=[];
function beep(ms){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=700;g.gain.value=.4;o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+ms/1000)}
async function play(){if(busy)return;busy=true;st.textContent='מנגן… הרגישו!';await wait(500);
  for(const d of WORD[cur]){if(canBuzz){try{navigator.vibrate(d*U)}catch(e){}}else beep(d*U);await wait(d*U+U*1.4)}
  busy=false;played[cur]=1;render()}
document.getElementById('play').onclick=play;
document.getElementById('next').onclick=()=>{if(!busy&&cur<WORD.length-1){cur++;render()}};
document.getElementById('prev').onclick=()=>{if(!busy&&cur>0){cur--;render()}};
render();
</script>
</body></html>
