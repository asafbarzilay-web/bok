<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>קוד רטט</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
#flash{position:fixed;inset:0;background:#F2F5F4;opacity:0;pointer-events:none;transition:opacity .05s}
#flash.on{opacity:1}
</style>
</head><body>
<div id="flash"></div>
<h1>📳 הודעה ברטט</h1>
<p>שימו יד על הטלפון ולחצו "נגנו". הטלפון ירטוט מילה בקוד: רטט קצר = • , רטט ארוך = ▬. הטבלה נמצאת בשקף.</p>
<p class="small">באייפון אין רטט מהדפדפן, אז המסך יהבהב במקום (קצר / ארוך).</p>
<button class="btn" id="go">▶ נגנו</button>
<div class="card" id="st">מוכן</div>
<script>
// word: ח ו ש  →  •••• | •▬▬ | •••
const WORD=[[1,1,1,1],[1,3,3],[1,1,1]],U=220;
const fl=document.getElementById('flash'),st=document.getElementById('st');let busy=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
document.getElementById('go').onclick=async()=>{if(busy)return;busy=true;st.textContent='מנגן… הרגישו!';await wait(800);
  for(let li=0;li<WORD.length;li++){st.textContent='אות '+(li+1)+' מתוך '+WORD.length;
    for(const d of WORD[li]){try{navigator.vibrate&&navigator.vibrate(d*U)}catch(e){}fl.classList.add('on');await wait(d*U);fl.classList.remove('on');await wait(U*1.3)}
    await wait(U*5)}
  st.textContent='נגמר. אפשר לנגן שוב.';busy=false};
</script>
</body></html>
