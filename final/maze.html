<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>מבוך</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>canvas{background:#2B2752;border-radius:16px;touch-action:none;max-width:100%}</style>
</head><body>
<h1>🟡 המבוך</h1>
<p id="msg">הכניסו את הכדור לחור הירוק. היזהרו מהבורות האדומים!</p>
<button class="btn" id="go">התחילו</button>
<canvas id="c" width="304" height="418" hidden></canvas>
<div class="code" id="code">הצלחתם! מילת הקוד:<b>פינגווין</b></div>
<script>
// 1 = wall, X = hole (back to start), E = goal
const M=[
"1111111111111111",
"1000000X000X1001",
"1000X00000001001",
"1111111111001001",
"10000X0000001001",
"1000000X00001001",
"1001111111111001",
"10010000000X1001",
"10X1000000001001",
"1001111001001001",
"1000X00001000001",
"1X00000001000001",
"1111111111111001",
"1000000001000001",
"10000000010000X1",
"1001111001001111",
"10000010010000X1",
"1000001001000001",
"1001001111111001",
"1001000000000001",
"10010000000000E1",
"1111111111111111"];
const C=19,cv=document.getElementById('c'),g=cv.getContext('2d');
let x=28.5,y=28.5,vx=0,vy=0,ax=0,ay=0,won=false,run=false;const R=6;
const wall=(cx,cy)=>{const r=M[cy];return !r||r[cx]==='1'||r[cx]===undefined};
let goal,holes=[],falls=0,hist=[];M.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch==='X')holes.push({x:i*C+C/2,y:j*C+C/2})}));M.forEach((r,j)=>{const i=r.indexOf('E');if(i>=0)goal={x:i*C+C/2,y:j*C+C/2}});
function hit(px,py){for(const[dx,dy]of[[R,0],[-R,0],[0,R],[0,-R],[R*.7,R*.7],[-R*.7,R*.7],[R*.7,-R*.7],[-R*.7,-R*.7]]){if(wall(Math.floor((px+dx)/C),Math.floor((py+dy)/C)))return true}return false}
function step(){if(!run)return;vx=(vx+ax*.28)*.96;vy=(vy+ay*.28)*.96;
  const sp=Math.hypot(vx,vy);if(sp>3.2){vx*=3.2/sp;vy*=3.2/sp}
  if(!hit(x+vx,y))x+=vx;else vx*=-.3;
  if(!hit(x,y+vy))y+=vy;else vy*=-.3;
  hist.push({x,y});if(hist.length>400)hist.shift();
  if(!won)for(const h of holes)if(Math.hypot(x-h.x,y-h.y)<5.5){x=28.5;y=28.5;hist.length=0;vx=vy=0;falls++;document.getElementById('msg').textContent='נפלתם לבור! חוזרים להתחלה ('+falls+')';try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
  if(!won&&Math.hypot(x-goal.x,y-goal.y)<8){won=true;document.getElementById('code').style.display='block';try{navigator.vibrate&&navigator.vibrate([80,60,200])}catch(e){}}
  draw();requestAnimationFrame(step)}
function draw(){g.clearRect(0,0,cv.width,cv.height);g.fillStyle='#8FD6C8';
  M.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch==='1')g.fillRect(i*C,j*C,C,C)}));
  g.fillStyle='#FF6B6B';holes.forEach(h=>{g.beginPath();g.arc(h.x,h.y,7,0,7);g.fill()});g.fillStyle='#3DDC84';g.beginPath();g.arc(goal.x,goal.y,9,0,7);g.fill();
  g.fillStyle=won?'#3DDC84':'#FFD166';g.beginPath();g.arc(x,y,R,0,7);g.fill()}
function onOri(e){if(e.gamma==null)return;ax=Math.max(-1,Math.min(1,e.gamma/30));ay=Math.max(-1,Math.min(1,(e.beta-10)/30))}
document.getElementById('go').onclick=async()=>{
  try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission()}catch(e){}
  addEventListener('deviceorientation',onOri);
  document.getElementById('go').hidden=true;cv.hidden=false;run=true;draw();step()};
</script>
</body></html>
