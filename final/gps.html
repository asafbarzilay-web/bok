<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>חם קר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body{justify-content:center;min-height:100vh;gap:18px;transition:background .6s}
#ball{width:210px;height:210px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:84px;transition:background .6s,box-shadow .6s;animation:beat 1.6s infinite}
@keyframes beat{50%{transform:scale(1.06)}}
#word{font-size:34px;font-weight:900;min-height:44px}
#trend{font-size:20px;min-height:28px;opacity:.9}
#dist{font-size:16px;opacity:.65;min-height:22px}
#msg{font-size:15px;color:#FFD166;min-height:20px;max-width:340px}
.code{display:none}
.code.show{display:block}
</style></head><body>
<div id="ball">🧭</div>
<div id="word">מחפשים אות…</div>
<div id="trend"></div>
<div id="dist"></div>
<div id="msg"></div>
<div class="code" id="code">מילת הקוד<b>לוויין</b></div>
<script>
const Q=new URLSearchParams(location.search);
const TARGET={lat:32.080698,lon:34.816254};
const R=+Q.get('r')||8;                 // success radius, metres
const CODE='לוויין';
const $=id=>document.getElementById(id);
const rad=x=>x*Math.PI/180;
function dist(a,b){const R6=6371000,dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon),x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R6*Math.asin(Math.sqrt(x))}
const STAGES=[[150,'קפוא','🥶','#3b6fd6'],[80,'קר','🧊','#4d9be0'],[40,'פושר','😐','#6cc4c4'],[20,'חמים','🙂','#e8c14a'],[R*2.2,'חם','🔥','#ff9f40'],[R,'רותח!','🌋','#ff4d3a']];
let hist=[],hits=0,solved=false,lastD=null;
function stage(d){for(const s of STAGES)if(d>s[0])return s;return STAGES[STAGES.length-1]}
function show(d,acc){
  hist.push(d);if(hist.length>6)hist.shift();
  const sm=hist.slice(-3).reduce((a,b)=>a+b,0)/Math.min(3,hist.length);
  const s=stage(sm);
  $('ball').textContent=s[2];$('ball').style.background=s[3];$('ball').style.boxShadow='0 0 60px '+s[3];
  $('word').textContent=s[1];
  if(hist.length>=4){const old=hist.slice(-6,-3).reduce((a,b)=>a+b,0)/hist.slice(-6,-3).length;const dd=sm-old;
    $('trend').textContent=dd<-1.5?'⬆️ מתחממים':dd>1.5?'⬇️ מתקררים':'';}
  $('dist').textContent='כ-'+(sm>60?Math.round(sm/10)*10:Math.round(sm/5)*5)+' מטר'+(acc>25?' · אות GPS חלש':'');
  if(acc>25){$('msg').textContent='ממתינים לאות GPS טוב יותר…';hits=0;return}
  $('msg').textContent='';
  if(sm<=R){hits++;if(hits>=2)win()}else hits=0}
function win(){if(solved)return;solved=true;$('ball').textContent='🎯';$('ball').style.background='#3DDC84';$('ball').style.boxShadow='0 0 60px #3DDC84';
  $('word').textContent='הגעתם!';$('trend').textContent='';$('dist').textContent='';$('code').classList.add('show');confetti();try{navigator.vibrate&&navigator.vibrate([100,60,200])}catch(e){}}
function onPos(p){if(solved)return;show(dist({lat:p.coords.latitude,lon:p.coords.longitude},TARGET),p.coords.accuracy||0)}
function onErr(e){$('word').textContent='אין מיקום';$('msg').textContent=e.code===1?'אין הרשאה למיקום. אשרו אותה בדפדפן (ובהגדרות הטלפון) ורעננו את הדף.':'לא מצליחים לקבל מיקום. נסו לצאת החוצה.'}
const at=Q.get('at');
if(at){const [la,lo]=at.split(',').map(Number);setInterval(()=>onPos({coords:{latitude:la,longitude:lo,accuracy:5}}),700)}   // test mode
else if(navigator.geolocation)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
else onErr({code:0});
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99';document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,g=c.getContext('2d'),C=['#8FD6C8','#FFD166','#FF9F80','#B8A6FF','#3DDC84','#F2F5F4'];
  const P=[...Array(140)].map(()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,s:Math.random()*8+5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:C[Math.random()*C.length|0]}));
  const t0=performance.now();(function f(t){g.clearRect(0,0,W,H);const a=1-Math.max(0,(t-t0-1400)/600);
    for(const p of P){p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=Math.max(0,a);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()}
    if(t-t0<2000)requestAnimationFrame(f);else c.remove()})(t0)}
</script></body></html>
