<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>תסדרו את מה שהתבלגן</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body{justify-content:center;min-height:100vh;gap:30px}
#start{min-width:150px}
#start[hidden]{display:none}
#grid{position:relative;display:flex;flex-direction:column;gap:6px;align-items:flex-start;direction:rtl;padding:8px}
.row{display:flex;direction:rtl;position:relative}
.cell{width:58px;height:58px;background:#F2F5F4;border:3px solid #14122b;margin-left:-3px;position:relative;box-sizing:border-box}
.cell:first-child{border-top-right-radius:8px;border-bottom-right-radius:8px}
.cell:last-child{border-top-left-radius:8px;border-bottom-left-radius:8px;margin-left:0}
.num{position:absolute;top:1px;right:4px;font-size:11px;font-weight:700;color:#5d5aa0}
.tile{position:absolute;left:0;top:0;width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#14122b;background:transparent;border:0;border-radius:8px;box-sizing:border-box;transition:transform .12s ease-out,background .3s,box-shadow .3s;will-change:transform;z-index:2}
.tile.ok{background:#3DDC84;box-shadow:0 0 0 5px #F2F5F4 inset,0 0 0 2px #14122b;border-radius:6px}
.tile.shaking{animation:wob .12s infinite}
.tile.pop{animation:pop .45s}
@keyframes wob{0%{rotate:-9deg}50%{rotate:9deg}100%{rotate:-9deg}}
@keyframes pop{50%{scale:1.25}}
#hint{position:fixed;bottom:14px;left:0;right:0;font-size:13px;opacity:.45;text-align:center}
</style></head><body>
<button class="btn" id="start">התחלה</button>
<h1>תסדרו את מה שהתבלגן</h1>
<div id="grid"></div>
<div id="hint" hidden></div>
<script>
const WORDS=['אלפא','רמת','גן'];
const BASE={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'},FIN={'כ':'ך','מ':'ם','נ':'ן','פ':'ף','צ':'ץ'};
const target=WORDS.join('').split('').map(c=>BASE[c]||c);   // 9 letters
const N=target.length,isEnd=[];{let i=0;WORDS.forEach(w=>{for(let k=0;k<w.length;k++)isEnd[i++]=(k===w.length-1)})}
const P_LOCK=0.5;                       // chance that a shake puts one letter in its place
const grid=document.getElementById('grid'),cells=[];
WORDS.forEach((w,wi)=>{const r=document.createElement('div');r.className='row';for(let k=0;k<w.length;k++){const c=document.createElement('div');c.className='cell';if(k===0){const n=document.createElement('span');n.className='num';n.textContent=wi+1;c.appendChild(n)}r.appendChild(c);cells.push(c)}grid.appendChild(r)});
const rnd=n=>Math.random()*n|0,shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
// tiles: one per letter instance, tile.slot = current cell index
let slotLetter,tiles=[],locked=Array(N).fill(false),solved=false,busy=false,lastShake=0,sensor=false,needTap=false,started=false,miss=0;   // miss = consecutive shakes that fixed nothing
function deranged(){let p;do{p=shuffle(target)}while(p.some((c,i)=>c===target[i]));return p}
slotLetter=deranged();
function pos(s){const c=cells[s];return [c.offsetLeft+c.parentElement.offsetLeft,c.offsetTop+c.parentElement.offsetTop]}
function place(t,s,tr){const [x,y]=pos(s);t.el.style.transform=`translate(${x}px,${y}px)`;t.slot=s;t.el.textContent=solved&&isEnd[s]&&FIN[t.ch]?FIN[t.ch]:t.ch}
function build(){tiles.forEach(t=>t.el.remove());tiles=slotLetter.map((ch,s)=>{const el=document.createElement('div');el.className='tile';grid.appendChild(el);const t={el,ch,slot:s};place(t,s);return t})}
build();addEventListener('resize',()=>tiles.forEach(t=>place(t,t.slot)));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function plan(){      // returns new slotLetter: at most ONE new correct letter (or none)
  const free=[];for(let s=0;s<N;s++)if(!locked[s])free.push(s);
  if(free.length<=1)return slotLetter.slice();
  const letters=free.map(s=>slotLetter[s]);
  const lockOne=free.length<=2||miss>=3||Math.random()<P_LOCK;   // the last two letters always settle together   // after 3 misses in a row the 4th shake always fixes a letter
  let pick=-1,pool=letters.slice(),fs=free.slice();
  if(lockOne){pick=free[rnd(free.length)];const i=pool.indexOf(target[pick]);pool.splice(i,1);fs=free.filter(s=>s!==pick)}
  // shuffle the rest so that NO other free slot becomes correct
  let sh,tries=0;do{sh=shuffle(pool);tries++}while(tries<200&&sh.some((c,k)=>c===target[fs[k]]));
  const next=slotLetter.slice();if(pick>=0)next[pick]=target[pick];
  fs.forEach((s,k)=>next[s]=sh[k]);   // (if no derangement exists, extra letters may settle too)
  return next}
async function doShuffle(){
  if(solved||busy||!started)return;busy=true;
  const free=[];for(let s=0;s<N;s++)if(!locked[s])free.push(s);
  const mov=tiles.filter(t=>!locked[t.slot]);
  mov.forEach(t=>t.el.classList.add('shaking'));
  for(let k=0;k<5;k++){const ps=shuffle(free);mov.forEach((t,i)=>place(t,ps[i]));await wait(140)}   // letters visibly swap places
  const next=plan(),used=new Set();
  mov.forEach(t=>{});                                          // map tiles to the planned letters
  const pending=mov.slice();
  free.forEach(s=>{const i=pending.findIndex(t=>t.ch===next[s]);const t=pending.splice(i,1)[0];place(t,s)});
  slotLetter=next;await wait(150);
  mov.forEach(t=>t.el.classList.remove('shaking'));
  let gained=0;
  tiles.forEach(t=>{if(!locked[t.slot]&&t.ch===target[t.slot]){gained++;locked[t.slot]=true;t.el.classList.add('ok','pop');setTimeout(()=>t.el.classList.remove('pop'),500)}});
  miss=gained?0:miss+1;
  const left=[];for(let s=0;s<N;s++)if(!locked[s])left.push(s);
  if(left.length===1){const s=left[0];locked[s]=true;tiles.find(t=>t.slot===s).el.classList.add('ok','pop')}
  if(locked.every(Boolean)){solved=true;tiles.forEach(t=>place(t,t.slot));await wait(300);confetti();try{navigator.vibrate&&navigator.vibrate([80,60,160])}catch(e){}}
  busy=false}
function onMotion(e){
  const a=e.accelerationIncludingGravity;if(!a)return;sensor=true;
  const now=Date.now(),m=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);
  if(onMotion.p!==undefined&&Math.abs(m-onMotion.p)>22&&now-lastShake>1200&&!busy){lastShake=now;doShuffle()}
  onMotion.p=m}
const hint=document.getElementById('hint');let pageT=Date.now();
const startSensors=()=>addEventListener('devicemotion',onMotion);
const startBtn=document.getElementById('start');
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
startSensors();
startBtn.onclick=async()=>{
  if(isIOS&&window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'){
    try{const r=await DeviceMotionEvent.requestPermission();if(r!=='granted'){hint.hidden=false;hint.textContent='החיישנים חסומים בדפדפן'}}catch(e){hint.hidden=false;hint.textContent='החיישנים לא זמינים'}}
  started=true;pageT=Date.now();startBtn.style.visibility='hidden';startBtn.style.pointerEvents='none'};
document.body.addEventListener('click',e=>{if(!started||e.target===startBtn)return;if(!sensor&&Date.now()-pageT>2500)doShuffle()});   // device without a motion sensor: tap shuffles
document.addEventListener('keydown',e=>{if(e.code==='Space')doShuffle()});
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99';document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,g=c.getContext('2d'),C=['#8FD6C8','#FFD166','#FF9F80','#B8A6FF','#3DDC84','#F2F5F4'];
  const P=[...Array(140)].map(()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,s:Math.random()*8+5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:C[Math.random()*C.length|0]}));
  const t0=performance.now();(function f(t){g.clearRect(0,0,W,H);const a=1-Math.max(0,(t-t0-1400)/600);
    for(const p of P){p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=Math.max(0,a);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()}
    if(t-t0<2000)requestAnimationFrame(f);else c.remove()})(t0)}
</script></body></html>
