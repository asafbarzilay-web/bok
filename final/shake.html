<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>תסדרו את מה שהתבלגן</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body{justify-content:center;min-height:100vh;gap:26px}
.row{display:flex;gap:8px;justify-content:center;direction:rtl}
.t{width:52px;height:60px;border-radius:12px;background:#2B2752;border:2px solid #4b4780;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#F2F5F4;transition:background .25s,border-color .25s,color .25s}
.t.ok{background:#3DDC84;border-color:#3DDC84;color:#1E1B3A;animation:pop .35s}
.t.jump{animation:jmp .45s}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes jmp{0%{transform:translate(0,0) rotate(0)}30%{transform:translate(var(--x),var(--y)) rotate(var(--r))}60%{transform:translate(calc(var(--x)*-.6),calc(var(--y)*-.6)) rotate(calc(var(--r)*-.7))}100%{transform:none}}
#rows{display:flex;flex-direction:column;gap:14px}
#hint{position:fixed;bottom:14px;left:0;right:0;font-size:13px;opacity:.45;text-align:center}
</style></head><body>
<h1>תסדרו את מה שהתבלגן</h1>
<div id="rows"></div>
<div id="hint" hidden></div>
<script>
const WORDS=['אלפא','רמת','גן'];
const BASE={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'},FIN={'כ':'ך','מ':'ם','נ':'ן','פ':'ף','צ':'ץ'};
const target=WORDS.join('').split('').map(c=>BASE[c]||c);          // 9 letters (base forms)
const isEnd=[];{let i=0;WORDS.forEach(w=>{for(let k=0;k<w.length;k++){isEnd[i++]=(k===w.length-1)}})}
let cur=[],locked=target.map(()=>false),solved=false,lastShake=0,sensor=false,needTap=false;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function initial(){let p;do{p=shuffle(target)}while(p.some((c,i)=>c===target[i]));return p}
cur=initial();
const rowsEl=document.getElementById('rows');let tiles=[];
(function build(){let i=0;WORDS.forEach(w=>{const r=document.createElement('div');r.className='row';for(let k=0;k<w.length;k++){const d=document.createElement('div');d.className='t';rowsEl.appendChild(r);r.appendChild(d);tiles[i++]=d}})})();
function draw(){tiles.forEach((d,i)=>{const c=cur[i];d.textContent=isEnd[i]&&FIN[c]?FIN[c]:c;d.classList.toggle('ok',locked[i])})}
draw();
function doShuffle(){
  if(solved)return;
  const free=locked.map((l,i)=>l?-1:i).filter(i=>i>=0);
  // guarantee progress: one random free slot gets its correct letter
  const pick=free[Math.random()*free.length|0],pool=free.filter(i=>i!==pick);
  const letters=[];free.forEach(i=>letters.push(cur[i]));
  // remove one copy of the correct letter for 'pick' from the pool of letters
  const idx=letters.indexOf(target[pick]);
  if(idx>=0)letters.splice(idx,1);
  let sh=shuffle(letters);
  if(pool.length>1&&idx>=0){let tries=0;while(tries++<20&&pool.every((s,k)=>sh[k]===cur[s]))sh=shuffle(letters)}
  const next=cur.slice();next[pick]=target[pick];pool.forEach((s,k)=>next[s]=sh[k]);
  cur=next;
  free.forEach(i=>{if(cur[i]===target[i])locked[i]=true});
  tiles.forEach((d,i)=>{if(free.includes(i)){d.style.setProperty('--x',(Math.random()*40-20)+'px');d.style.setProperty('--y',(Math.random()*40-20)+'px');d.style.setProperty('--r',(Math.random()*50-25)+'deg');d.classList.remove('jump');void d.offsetWidth;d.classList.add('jump')}});
  setTimeout(draw,200);
  if(locked.every(Boolean)){solved=true;setTimeout(()=>{draw();confetti();try{navigator.vibrate&&navigator.vibrate([80,60,160])}catch(e){}},500)}
}
function onMotion(e){
  const a=e.accelerationIncludingGravity;if(!a)return;sensor=true;
  const now=Date.now(),m=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);
  if(onMotion.p!==undefined&&Math.abs(m-onMotion.p)>22&&now-lastShake>900){lastShake=now;doShuffle()}
  onMotion.p=m}
const hint=document.getElementById('hint');
function startSensors(){window.addEventListener('devicemotion',onMotion)}
if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'){needTap=true;hint.hidden=false;hint.textContent='הקישו על המסך כדי להפעיל את החיישנים'}
else startSensors();
document.body.addEventListener('click',async()=>{
  if(needTap){needTap=false;try{const r=await DeviceMotionEvent.requestPermission();if(r==='granted'){startSensors();hint.hidden=true}else{hint.textContent='החיישנים חסומים בדפדפן'}}catch(e){hint.textContent='החיישנים לא זמינים'}return}
  if(!sensor&&Date.now()-pageT>2500)doShuffle()});          // devices without a motion sensor: tap shuffles
document.addEventListener('keydown',e=>{if(e.code==='Space')doShuffle()});
const pageT=Date.now();
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99';document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,g=c.getContext('2d'),C=['#8FD6C8','#FFD166','#FF9F80','#B8A6FF','#3DDC84','#F2F5F4'];
  const P=[...Array(140)].map(()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,s:Math.random()*8+5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:C[Math.random()*C.length|0]}));
  const t0=performance.now();(function f(t){g.clearRect(0,0,W,H);const a=1-Math.max(0,(t-t0-1400)/600);
    for(const p of P){p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=Math.max(0,a);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()}
    if(t-t0<2000)requestAnimationFrame(f);else c.remove()})(t0)}
</script></body></html>
