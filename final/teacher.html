<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>טלפונית – לוח מורה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#1E1B3A;color:#F2F5F4;font-family:Heebo,Arial,sans-serif;padding:20px}
h1{margin:0 0 4px;font-size:26px}
.sub{opacity:.7;font-size:14px;margin-bottom:16px}
.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:#2B2752;border-radius:12px;padding:10px 16px}
.stat b{display:block;font-size:26px;color:#8FD6C8}
table{width:100%;border-collapse:collapse;background:#2B2752;border-radius:14px;overflow:hidden}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid #3a3566;font-size:15px}
th{background:#24204a;color:#8FD6C8;font-weight:700;position:sticky;top:0}
td.nm{text-align:right;font-weight:700;cursor:pointer;white-space:nowrap}
td.c{min-width:44px}
.ok{background:#1f5e44}.bad{background:#6a2b3a}.wait{background:#6b5a1f}.skip{background:#3a3566}
.n{font-size:11px;opacity:.8;display:block}
.done{color:#3DDC84}.live{color:#FFD166}
tr.det td{background:#1E1B3A;text-align:right;font-size:14px;line-height:1.7}
.err{background:#6a2b3a;padding:14px;border-radius:12px}
.small{font-size:13px;opacity:.7}
.trash{background:none;border:0;font-size:16px;cursor:pointer;opacity:.5}.trash:hover{opacity:1}
</style>
</head><body>
<h1>📊 טלפונית – משימת סיום</h1>
<div class="sub" id="sub">טוען…</div>
<div class="stats" id="stats"></div>
<table id="t"></table>
<p class="small">לחיצה על שם פותחת את כל הניסיונות. ✅ נכון · ❌ טעה ועוד לא פתר · ⏭ דילג · 📝 לבדיקת המורה · המספר הקטן = מספר ניסיונות.</p>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbyWv0CAcSiM_lUJn1j6ngdL1KhhNnQ4NpIEhsCtjRUcebJsCorne7bY6BEYSLHu7MC7tw/exec';
const KEY=new URLSearchParams(location.search).get('key')||'';
const NQ=11,open={};
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){
  if(!ENDPOINT){document.getElementById('sub').innerHTML='<div class="err">עוד לא חובר גיליון.</div>';return}
  if(!KEY){document.getElementById('sub').innerHTML='<div class="err">חסר מפתח מורה בכתובת (?key=…)</div>';return}
  let data;try{data=await (await fetch(ENDPOINT+'?key='+encodeURIComponent(KEY))).json()}catch(e){document.getElementById('sub').textContent='שגיאה בטעינה, מנסה שוב…';return}
  if(data.error){document.getElementById('sub').innerHTML='<div class="err">מפתח שגוי</div>';return}
  const P={};
  for(const [t,sid,name,ev,q,a,r,n,sec] of data.rows){
    const p=P[sid]||(P[sid]={sid,name,start:t,last:t,sec:0,q:{},log:[],fin:null});
    p.last=Math.max(p.last,t);p.sec=Math.max(p.sec,+sec||0);
    if(ev==='try'){const c=p.q[q]||(p.q[q]={n:0,st:'bad'});c.n=Math.max(c.n,+n||c.n+1);if(r==='✅')c.st='ok';else if(r==='📝'&&c.st!=='ok')c.st='wait';p.log.push([sec,q,a,r])}
    if(ev==='skip'){const c=p.q[q]||(p.q[q]={n:0,st:'skip'});if(c.st==='bad'&&!c.n)c.st='skip';if(!c.n)c.st='skip';p.log.push([sec,q,'—','⏭'])}
    if(ev==='finish'){p.fin=r}
  }
  const L=Object.values(P).map(p=>{p.score=Object.values(p.q).filter(c=>c.st==='ok').length;p.wrong=Object.values(p.q).reduce((s,c)=>s+Math.max(0,c.n-(c.st==='ok'||c.st==='wait'?1:0)),0);return p})
    .sort((a,b)=>b.score-a.score||a.sec-b.sec);
  document.getElementById('sub').textContent='מתעדכן כל 10 שניות · עדכון אחרון '+new Date().toLocaleTimeString('he-IL');
  const fin=L.filter(p=>p.fin).length;
  document.getElementById('stats').innerHTML=`<div class="stat"><b>${L.length}</b>תלמידים</div><div class="stat"><b>${fin}</b>סיימו</div><div class="stat"><b>${L.length?(L.reduce((s,p)=>s+p.score,0)/L.length).toFixed(1):0}</b>ממוצע נכונות</div>`;
  let h='<tr><th>שם</th>'+[...Array(NQ)].map((_,i)=>'<th>'+(i+1)+'</th>').join('')+'<th>ציון</th><th>טעויות</th><th>זמן</th><th>מצב</th><th></th></tr>';
  for(const p of L){
    h+=`<tr><td class="nm" onclick="tog('${p.sid}')">${esc(p.name)}</td>`;
    for(let i=1;i<=NQ;i++){const c=p.q[i];h+=c?`<td class="c ${c.st}">${{ok:'✅',bad:'❌',wait:'📝',skip:'⏭'}[c.st]}${c.n>1?'<span class="n">'+c.n+'</span>':''}</td>`:'<td class="c"></td>'}
    h+=`<td><b>${p.score}</b></td><td>${p.wrong}</td><td>${fmt(p.sec)}</td><td class="${p.fin?'done':'live'}">${p.fin?'סיים':'עובד…'}</td><td><button class="trash" title="מחיקה" onclick="del('${p.sid}','${esc(p.name).replace(/'/g,'')}')">🗑</button></td></tr>`;
    if(open[p.sid])h+=`<tr class="det"><td colspan="${NQ+6}">${p.log.map(([s,q,a,r])=>`${fmt(s)} · שאלה ${q} · ${r} ${esc(a)}`).join('<br>')||'אין עדיין ניסיונות'}</td></tr>`;
  }
  document.getElementById('t').innerHTML=h;
}
async function del(sid,name){
  if(!confirm('למחוק את "'+name+'" מהגיליון?\nאי אפשר לבטל (אפשר לשחזר רק מהיסטוריית הגרסאות של הגיליון).'))return;
  try{const r=await (await fetch(ENDPOINT+'?key='+encodeURIComponent(KEY)+'&del='+encodeURIComponent(sid))).json();
    if(r.error){alert('שגיאה: '+r.error);return}
    if(r.deleted===undefined){alert('הסקריפט בגיליון עדיין בגרסה הישנה. צריך להדביק את Code.gs החדש ולפרוס גרסה חדשה (פריסה ← ניהול פריסות ← עיפרון ← גרסה חדשה).');return}}catch(e){alert('המחיקה נכשלה, נסו שוב.');return}
  load()}
function tog(s){open[s]=!open[s];load()}
load();setInterval(load,10000);
</script>
</body></html>
