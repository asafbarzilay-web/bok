<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>מד קול</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
.meter{position:relative;width:70px;height:320px;background:#2B2752;border-radius:20px;overflow:hidden}
.band{position:absolute;left:0;right:0;bottom:45%;height:20%;transition:bottom .7s ease;background:rgba(61,220,132,.35);border-top:2px solid #3DDC84;border-bottom:2px solid #3DDC84}
.lvl{position:absolute;left:10px;right:10px;bottom:0;height:0;background:#FFD166;border-radius:12px 12px 0 0;transition:height .08s}
.ring{font-size:22px;font-weight:700}
.steps{display:flex;gap:8px;justify-content:center}.steps i{width:30px;height:8px;border-radius:4px;background:#2B2752}.steps i.ok{background:#3DDC84}.steps i.now{background:#FFD166}
</style>
</head><body>
<h1>🎤 מד הקול</h1>
<p>השמיעו קול כך שהפס הצהוב יישאר בתוך האזור הירוק 5 שניות. כל פעם שמצליחים, האזור הירוק זז למקום אחר: לפעמים צריך ללחוש, לפעמים לצעוק.</p>
<div class="steps" id="steps"></div>
<button class="btn" id="go">התחילו</button>
<div class="meter"><div class="band"></div><div class="lvl" id="lvl"></div></div>
<div class="ring" id="t">⁦0.0 / 5.0⁩</div>
<div class="code" id="code">הצלחתם! מילת הקוד:<b>אבטיח</b></div>
<script>
const lvl=document.getElementById('lvl'),t=document.getElementById('t'),band=document.querySelector('.band');
const STAGES=[.42,.14,.70,.26,.78],H=.2,NEED=5;let st=0,held=0,out=0,last=0,won=false,sm=0,pause=0;
function stage(){band.style.bottom=(STAGES[st]*100)+'%';document.getElementById('steps').innerHTML=STAGES.map((_,i)=>'<i class="'+(i<st?'ok':i===st?'now':'')+'"></i>').join('')}
stage();
document.getElementById('go').onclick=async()=>{
  let an;
  try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(s).connect(an)}
  catch(e){t.textContent='אין גישה למיקרופון 😕';return}
  document.getElementById('go').hidden=true;const buf=new Float32Array(an.fftSize);last=performance.now();
  (function loop(now){an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;const rms=Math.sqrt(s/buf.length);
    const db=20*Math.log10(rms+1e-6);const p=Math.max(0,Math.min(1,(db+60)/50));sm=sm*.7+p*.3;
    lvl.style.height=(sm*100)+'%';const dt=(now-last)/1000;last=now;
    if(won){requestAnimationFrame(loop);return}
    if(pause>0){pause-=dt;requestAnimationFrame(loop);return}
    const lo=STAGES[st],ok=sm>=lo&&sm<=lo+H;
    if(ok){held+=dt;out=0}else{out+=dt;if(out>.35)held=0}
    t.textContent='שלב '+(st+1)+' מתוך '+STAGES.length+' · \u2066'+Math.min(NEED,held).toFixed(1)+' / '+NEED.toFixed(1)+'\u2069';
    lvl.style.background=ok?'#3DDC84':'#FFD166';
    if(held>=NEED){st++;held=0;out=0;try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
      if(st>=STAGES.length){won=true;stage();document.getElementById('code').style.display='block';t.textContent='✔ כל הכבוד!'}
      else{stage();pause=1;t.textContent='👏 יפה! האזור זז…'}}
    requestAnimationFrame(loop)})(performance.now());
};
</script>
</body></html>
