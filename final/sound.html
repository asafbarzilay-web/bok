<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>מד קול</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
.meter{position:relative;width:70px;height:320px;background:#2B2752;border-radius:20px;overflow:hidden}
.band{position:absolute;left:0;right:0;bottom:45%;height:20%;background:rgba(61,220,132,.35);border-top:2px solid #3DDC84;border-bottom:2px solid #3DDC84}
.lvl{position:absolute;left:10px;right:10px;bottom:0;height:0;background:#FFD166;border-radius:12px 12px 0 0;transition:height .08s}
.ring{font-size:22px;font-weight:700}
</style>
</head><body>
<h1>🎤 מד הקול</h1>
<p>השמיעו קול כך שהפס הצהוב יישאר בתוך האזור הירוק 3 שניות ברצף.</p>
<button class="btn" id="go">התחילו</button>
<div class="meter"><div class="band"></div><div class="lvl" id="lvl"></div></div>
<div class="ring" id="t">0.0 / 3.0</div>
<div class="code" id="code">הצלחתם! מילת הקוד:<b>אבטיח</b></div>
<script>
const lvl=document.getElementById('lvl'),t=document.getElementById('t');let held=0,last=0,won=false,sm=0;
document.getElementById('go').onclick=async()=>{
  let an;
  try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(s).connect(an)}
  catch(e){t.textContent='אין גישה למיקרופון 😕';return}
  document.getElementById('go').hidden=true;const buf=new Float32Array(an.fftSize);last=performance.now();
  (function loop(now){an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;const rms=Math.sqrt(s/buf.length);
    const db=20*Math.log10(rms+1e-6);const p=Math.max(0,Math.min(1,(db+60)/50));sm=sm*.7+p*.3;
    lvl.style.height=(sm*100)+'%';const dt=(now-last)/1000;last=now;
    const ok=sm>=.45&&sm<=.65;held=ok?held+dt:0;if(!won)t.textContent=Math.min(3,held).toFixed(1)+' / 3.0';
    lvl.style.background=ok?'#3DDC84':'#FFD166';
    if(!won&&held>=3){won=true;document.getElementById('code').style.display='block';t.textContent='✔'}
    requestAnimationFrame(loop)})(performance.now());
};
</script>
</body></html>
