<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>הודעה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
body{justify-content:center;min-height:100vh;gap:16px}
#start[hidden]{display:none}
#cells{display:flex;direction:rtl;gap:8px}
.c{width:46px;height:62px;border-radius:10px;background:#2B2752;border:2px solid #3b3670;display:flex;align-items:center;justify-content:center;font:900 34px Heebo,Arial;color:#FFD166;position:relative;overflow:hidden}
.c i{position:absolute;font-style:normal;color:#5d5aa0;font-size:26px}
.c b{position:relative;opacity:0}
#sky{position:relative;width:84px;height:84px;font-size:68px;line-height:84px}
#sky span{position:absolute;inset:0;transition:filter .25s;filter:drop-shadow(0 0 16px #FFD166)}
#bar{width:280px;height:6px;border-radius:3px;background:#2B2752;overflow:hidden}
#bar div{height:100%;width:0;background:#8FD6C8;transition:width .15s linear}
#st{font-size:15px;opacity:.75;min-height:22px}
#cdot{position:fixed;top:12px;left:12px;font-size:26px;opacity:0;pointer-events:none}
#cdot.show{animation:pl 1.4s infinite}
@keyframes pl{0%,100%{opacity:.1}50%{opacity:.9}}
</style></head><body>
<div class="small" id="priv">הדף משתמש במצלמה. שום תמונה לא נשמרת ולא נשלחת לשום מקום.</div>
<button class="btn" id="start">התחלה</button>
<h1>יש כאן הודעה</h1>
<div id="sky"><span id="bulb">💡</span></div>
<div id="cells"></div>
<div id="bar"><div></div></div>
<div id="st"></div>
<div class="code" id="code">פוענח! מילת הקוד:<b>כוכבים</b></div>
<div id="cdot">📷</div>
<video id="v" playsinline muted autoplay style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none"></video>
<canvas id="cv" width="16" height="16" hidden></canvas>
<script>
const WORD='כוכבים',N=WORD.length,$=id=>document.getElementById(id);
const HOLD=9000,UP=1/HOLD,DOWN=1/(HOLD*2);   // ~9 s of darkness to decode; slowly fades when light returns
const cells=[...WORD].map(ch=>{const c=document.createElement('div');c.className='c';c.innerHTML='<i>●</i><b>'+ch+'</b>';$('cells').appendChild(c);return c});
const cv=$('cv'),g2=cv.getContext('2d',{willReadFrequently:true}),v=$('v');
let sky=0,hist=[],p=0,last=Date.now(),done=false,stream=null,t0=Date.now();
const meanLum=()=>{g2.drawImage(v,0,0,16,16);const d=g2.getImageData(0,0,16,16).data;let s=0;for(let i=0;i<d.length;i+=4)s+=.3*d[i]+.59*d[i+1]+.11*d[i+2];return s/256};
function render(){cells.forEach((c,i)=>{const o=Math.max(0,Math.min(1,p*N-i));c.querySelector('b').style.opacity=o;c.querySelector('i').style.opacity=1-o});$('bar').firstChild.style.width=(p*100)+'%'}
function tick(){
  if(done)return;
  const now=Date.now(),dt=now-last;last=now;
  const l=(window.__lum!==undefined)?window.__lum:(v.readyState>=2?meanLum():null);
  if(l!==null){
    hist.push([now,l]);while(hist.length&&now-hist[0][0]>5000)hist.shift();
    const base=Math.max(40,...hist.map(h=>h[1]));
    const d=Math.max(1-l/base,l<12?1:0);
    sky=sky*0.6+Math.min(1,d/0.55)*0.4;$('bulb').style.filter='grayscale('+sky+') brightness('+(1-sky*0.65)+') drop-shadow(0 0 '+(16*(1-sky))+'px #FFD166)';
    p=Math.max(0,Math.min(1,p+(d>=0.55?dt*UP:-dt*DOWN)));
    render();
    if(p>=1){finish();return}
  }
  const s=(now-t0)/1000;if(s>20)$('cdot').classList.add('show');if(s>45&&p===0)$('st').textContent='ההודעה נראית רק בחושך';
  setTimeout(tick,100)}
function finish(){done=true;render();$('code').style.display='block';$('cdot').classList.remove('show');try{navigator.vibrate&&navigator.vibrate([80,60,160])}catch(e){}try{stream.getTracks().forEach(t=>t.stop())}catch(e){}confetti()}
$('start').onclick=async()=>{
  $('start').hidden=true;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:160},height:{ideal:160}},audio:false})}
  catch(e){$('st').textContent='אין גישה למצלמה. אשרו גישה בדפדפן ורעננו את הדף.';$('start').hidden=false;return}
  v.srcObject=stream;try{await v.play()}catch(e){}
  t0=last=Date.now();tick()};
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99';document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,g=c.getContext('2d'),C=['#8FD6C8','#FFD166','#FF9F80','#B8A6FF','#3DDC84','#F2F5F4'];
  const P=[...Array(140)].map(()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,s:Math.random()*8+5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:C[Math.random()*C.length|0]}));
  const t0=performance.now();(function f(t){g.clearRect(0,0,W,H);const a=1-Math.max(0,(t-t0-1400)/600);
    for(const p of P){p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=Math.max(0,a);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()}
    if(t-t0<2000)requestAnimationFrame(f);else c.remove()})(t0)}
</script></body></html>
